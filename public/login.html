<!DOCTYPE html>
<html lang="te"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login 💌</title><meta name="theme-color" content="#1a0f33">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Mulish:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Mulish,system-ui,sans-serif;color:#fff6fb;background:linear-gradient(160deg,#3a1b6b,#1a0f33 55%,#4a1a45)}
.box{width:100%;max-width:380px;text-align:center}
h1{font:700 52px "Cormorant Garamond",Georgia,serif;line-height:1.05}
p{color:#e4d4fb;margin:10px 0 18px;line-height:1.5}
input{width:100%;padding:15px 16px;margin:6px 0;border-radius:14px;border:1px solid #ffffff40;background:#ffffff14;color:#fff;font:600 17px Mulish,sans-serif}
input::placeholder{color:#cdbbea}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:999px;font:700 17px Mulish,sans-serif;color:#2b0f2e;background:linear-gradient(135deg,#ffd58a,#ff6f91);cursor:pointer}
button:disabled{opacity:.6}
#err{min-height:24px;color:#ffb3c7;margin-top:12px;font-size:15px}
.fine{font-size:13px;color:#cdbbea}
</style></head><body>
<form class="box" id="f" autocomplete="on">
 <div style="font-size:54px">💌</div>
 <h1>Hi 💗</h1>
 <p>Ee page special ga nee kosam. Login ayyi open chey.</p>
 <input id="u" name="username" placeholder="Name" autocomplete="username" autocapitalize="none" required>
 <input id="p" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
 <p class="fine" style="margin:6px 0 0">Password: nee puttina roju (ddmmyyyy)</p>
 <button id="b" type="submit">Open chey 💗</button>
 <div id="err" role="alert"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
 e.preventDefault();const b=document.getElementById('b'),er=document.getElementById('err');b.disabled=true;er.textContent='';
 try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('u').value,password:document.getElementById('p').value})});
  if(r.ok){location.href='/'}else{er.textContent=r.status===429?'Chala sarlu try chesaru. Koncham aagi malli try chey.':'Name leda password tappu. Malli try chey.';b.disabled=false}}
 catch(x){er.textContent='Network problem. Malli try chey.';b.disabled=false}
});
</script></body></html>
